<script>
  (function(){
    var d = document.documentElement, t = null, l = null, tz = '';
    try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch(e){}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.dataset.theme = t;
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){}
    // same test as main.js on the front page: a stored choice, a Danish device or a Copenhagen clock
    var da = l === 'da' || (l !== 'en' && ((navigator.languages || [navigator.language || '']).join(',').toLowerCase().indexOf('da') > -1 || tz === 'Europe/Copenhagen'));
    if (da) { d.lang = 'da'; d.classList.add('da'); document.title = 'Siden findes ikke, Yasir Lokman Teksen'; }
  })();
</script>
<style>

* { box-sizing: border-box; margin: 0; }
